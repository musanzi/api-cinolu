services:
  api:
    container_name: onestop-api
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    ports:
      - ${PORT}:${PORT}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - onestop-network

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onestop-network

  db:
    container_name: onestop-db
    image: mariadb:12
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mariadb-admin ping -u root -p"$$MARIADB_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onestop-network

volumes:
  mariadb_data:
  uploads_data:

networks:
  onestop-network:
    driver: bridge
