services:
  api:
    container_name: onestop-api
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    ports:
      - ${PORT}:${PORT}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mariadb-admin ping -u root -p"$$MARIADB_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
  uploads_data:
